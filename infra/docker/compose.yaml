# Local stand-ins for the hosted services (STACK.md):
#   postgres  -> PlanetScale Postgres (same major: 17)
#   minio     -> Cloudflare R2, same bucket names
#   mailpit   -> Resend (SMTP catcher with a web UI)
name: molo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: molo
      POSTGRES_PASSWORD: molo
      POSTGRES_DB: molo
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U molo -d molo"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: molo
      MINIO_ROOT_PASSWORD: molo-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the two buckets R2 will have (ARCHITECTURE section 1 / STACK.md):
  # molo-public (published assets, CDN) and molo-private (incoming + processed).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 molo molo-local-secret &&
      mc mb --ignore-existing local/molo-public &&
      mc mb --ignore-existing local/molo-private &&
      mc anonymous set download local/molo-public &&
      echo 'buckets ready'
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres-data:
  minio-data:
