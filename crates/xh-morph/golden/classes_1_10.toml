# xh-morph golden file: noun classes 1 to 10 (with 1a and 2a)
#
# This file holds surface forms a native isiXhosa speaker has signed off.
# `cargo test` generates every case with the rule table in
# rules/noun_classes.toml and asserts equality. A case whose `expected` is
# empty FAILS the test on purpose: an unfilled golden is a rule nobody has
# checked, and the crate must not look green while that is true.
#
# In this open-source snapshot every `expected` is empty. The answers a
# native-speaker tutor gave are not published here: they are hers, and the
# golden gate stays red until a speaker fills the file again. `expected` is
# never copied from a dictionary, a grammar or an LLM. Fill it in a tutor
# session, from the tutor's mouth, and record who and when.
#
# Schema, one [[case]] per form:
#
#   lemma         the citation form of an isiXhosa lexicon row (isixhosa.click,
#                 CC BY-SA 4.0; the word_id is in `note`)
#   class         the noun class label of `lemma` ("1", "1a", "2", "2a", "3" ... "10")
#   form          plural | singular | subject_concord | object_concord | possessive | locative
#                 A noun case asks for the other side of its class pair
#                 (1/2, 1a/2a, 3/4, 5/6, 7/8, 9/10): "plural" on a singular-class
#                 lemma, "singular" on a plural-class lemma. Never the plural of
#                 a plural. A noun with no plural at all gets no pair case.
#   expected      the surface form the tutor gives. Conventions:
#                   plural           the whole word            e.g. the plural noun itself
#                   singular         the whole word            e.g. the singular noun itself
#                   subject_concord  concord with trailing -   e.g. "u-"  (as it attaches to a verb)
#                   object_concord   concord with hyphens both sides, e.g. "-m-"
#                   possessive       concord with trailing -   e.g. "wa-" (as in "... wa-m")
#                   locative         the whole word for at/in/to/from the noun.
#                                    xh-morph has no locative rule yet: these cases
#                                    collect answers first, and fail until a rule exists.
#                 If the tutor says the word is irregular, write the real form
#                 and set irregular = true; the test then expects generate() to
#                 DISAGREE, which documents the exception for the editor tooling.
#   validated_by  tutor's name or initials
#   validated_on  YYYY-MM-DD
#   note          where the lemma came from, what to ask, anything odd
#
# Coverage target before this crate is promoted: for each of the 12 classes,
# one pair case (its plural or its singular) and one case per concord, plus
# every irregular the tutor knows in the top 300.


