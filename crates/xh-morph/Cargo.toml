[package]
name = "xh-morph"
version = "0.1.0"
description = "Rule-based isiXhosa noun-class and concord generator, golden-tested against native-validated forms"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:serde_json"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", optional = true }
toml = { version = "1.1.5", default-features = false, features = ["parse", "serde", "std"] }
wasm-bindgen = { version = "0.2.127", optional = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
