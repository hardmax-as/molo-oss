[package]
name = "xh-audio"
version = "0.1.0"
description = "Molo audio pipeline: decode, trim, loudness-normalise, resample, encode Opus + FLAC master, write manifest"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "xh-audio"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
ebur128 = "0.1.10"
flacenc = "0.5.1"
ogg = "0.9"
opus = "0.4.0"
rubato = "5.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11.0"
symphonia = { version = "0.6.1", features = ["mp3"] }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
