[package]
name = "xh-fsrs"
version = "0.1.0"
description = "Thin wrapper over fsrs-rs for Molo's review scheduler, with a WASM export"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:getrandom"]

[dependencies]
fsrs = "6.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2.127", optional = true }
# fsrs pulls `rand`; on wasm32-unknown-unknown getrandom needs the JS backend.
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
