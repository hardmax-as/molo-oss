  <circle cx="128" cy="113" r="79" fill="#F6B73C"/>
  <path d="M0 164 C 56 146, 118 156, 174 164 C 205 168, 232 161, 256 154 L 256 256 L 0 256 Z" fill="#1FA38C"/>
  <path d="M0 197 C 77 184, 159 194, 256 184 L 256 256 L 0 256 Z" fill="#D9772B"/>
  <path d="M96 146 L96 82 L128 118 L160 82 L160 146" fill="none" stroke="#26264F"
    stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
