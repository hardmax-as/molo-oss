<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    The native splash image. Transparent, drawn over the sand background
    declared in app.json, and no wordmark: the app draws "Molo" itself in
    Fredoka the moment the splash hands over, so the type is the real face
    and not a picture of it (apps/mobile/src/ui/Launch.tsx).
  -->
  <defs>
    <clipPath id="splash-disc">
      <circle cx="512" cy="512" r="250"/>
    </clipPath>
  </defs>
  <circle cx="512" cy="512" r="250" fill="#F6B73C"/>
  <g clip-path="url(#splash-disc)">
    <path d="M262 622 C 348 584, 442 598, 536 614 C 622 628, 708 616, 762 594 L 762 762 L 262 762 Z" fill="#1FA38C"/>
    <path d="M262 690 C 380 662, 536 678, 762 664 L 762 762 L 262 762 Z" fill="#D9772B"/>
  </g>
  <g transform="translate(322 320) scale(1.72)">
