<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    The launcher icon: Eastern Cape light, the sunbird across the sun, three
    hill bands (docs/DESIGN.md "Illustration"). Opaque, because Apple rejects
    an icon with alpha, and full bleed, because iOS rounds the corners itself.

    The bird sits over the sun rather than in the hills: its body is `sea`,
    and `sea` on `sea` is a silhouette nobody can read at 60 px.
  -->
  <rect width="1024" height="1024" fill="#26264F"/>
  <circle cx="512" cy="440" r="300" fill="#F6B73C"/>
  <path d="M0 700 C 240 640, 480 672, 720 690 C 840 700, 940 686, 1024 664 L 1024 1024 L 0 1024 Z" fill="#1FA38C"/>
  <path d="M0 838 C 320 786, 640 822, 1024 794 L 1024 1024 L 0 1024 Z" fill="#D9772B"/>
  <g transform="translate(288 164) scale(2)">
    <path d="M78 132 C 52 150, 40 176, 46 190 C 60 176, 76 160, 92 148 Z" fill="#26264F"/>
    <path d="M84 134 C 62 150, 52 172, 56 186 C 66 172, 80 158, 96 148 Z" fill="#17806F"/>
    <path d="M112 104 C 140 92, 160 100, 166 116 C 150 114, 132 120, 118 128 Z" fill="#17806F"/>
    <ellipse cx="102" cy="122" rx="40" ry="34" fill="#1FA38C"/>
    <ellipse cx="108" cy="132" rx="26" ry="20" fill="#FFF7E8"/>
    <circle cx="120" cy="86" r="26" fill="#1FA38C"/>
    <path d="M142 84 C 162 84, 178 92, 190 104 C 174 100, 160 96, 142 92 Z" fill="#D9772B"/>
    <circle cx="126" cy="84" r="6" fill="#26264F"/>
    <circle cx="128" cy="82" r="2" fill="#FFFFFF"/>
    <path d="M96 112 C 70 100, 46 106, 34 122 C 52 118, 74 124, 92 132 Z" fill="#17806F" transform="rotate(30 96 116)"/>
  </g>
</svg>
